<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenManus Web界面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
        }

        .card {
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 10px;
        }

        #resultDisplay {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            min-height: 400px;
            background-color: #f9f9f9;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
        }

        /* 确保结果框内的所有元素都不会超出宽度 */
        #resultDisplay * {
            max-width: 100%;
        }

        /* 特别处理图片元素 */
        #resultDisplay img {
            max-width: 100%;
            height: auto;
        }

        /* 处理表格 */
        #resultDisplay table {
            max-width: 100%;
            table-layout: fixed;
        }

        #resultDisplay td,
        #resultDisplay th {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        #logDisplay {
            display: none;
        }

        .log-entry {
            margin: 0;
            padding: 2px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">OpenManus 智能买手</h1>

        <div class="row">
            <!-- 左侧：输入区域 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>查找要求</h5>
                    </div>
                    <div class="card-body">
                        <textarea id="textInput" class="form-control" rows="5" placeholder="请输入你的描述..."></textarea>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5>图片上传</h5>
                    </div>
                    <div class="card-body">
                        <input type="file" id="imageUpload" class="form-control" accept="image/*">
                        <div id="imageContainer" class="mt-3 text-center">
                            <img id="imagePreview" style="display: none;" alt="预览图">
                        </div>
                        <p id="imagePath" class="mt-2 small text-muted"></p>
                    </div>
                </div>

                <button id="processButton" class="btn btn-primary w-100 mt-3">处理</button>
            </div>

            <!-- 右侧：结果显示区域 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>结果</h5>
                    </div>
                    <div class="card-body">
                        <div id="resultDisplay"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let uploadedImagePath = '';

        // DOM元素
        const textInput = document.getElementById('textInput');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const imagePath = document.getElementById('imagePath');
        const processButton = document.getElementById('processButton');
        const resultDisplay = document.getElementById('resultDisplay');
        const logDisplay = document.getElementById('logDisplay');

        // 事件监听器
        imageUpload.addEventListener('change', uploadImage);
        processButton.addEventListener('click', processRequest);

        // 图片上传处理
        function uploadImage() {
            const file = imageUpload.files[0];
            if (!file) return;

            // 显示预览
            const reader = new FileReader();
            reader.onload = function (e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // 上传文件到服务器
            const formData = new FormData();
            formData.append('file', file);

            addLog('正在上传图片...');

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        uploadedImagePath = data.file_path;
                        imagePath.textContent = `文件路径: ${data.file_path}`;
                        addLog(`图片上传成功: ${data.file_path}`);
                    } else {
                        addLog(`图片上传失败: ${data.error}`, true);
                    }
                })
                .catch(error => {
                    addLog(`上传出错: ${error.message}`, true);
                });
        }

        // 处理请求
        function processRequest() {
            const text = textInput.value.trim();
            if (!text) {
                addLog('请输入文本描述', true);
                return;
            }

            // 清空结果显示
            resultDisplay.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"></div><p>正在处理请求...</p></div>';

            addLog('正在处理请求...');

            fetch('/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: text,
                    image_path: uploadedImagePath
                })
            })
                .then(response => response.json())
                .then(data => {
                    // 显示日志
                    if (data.logs && Array.isArray(data.logs)) {
                        data.logs.forEach(log => addLog(log));
                    }

                    if (data.success) {
                        // 显示结果
                        resultDisplay.innerHTML = '';

                        try {
                            // 尝试作为HTML渲染
                            resultDisplay.innerHTML = data.result;
                        } catch (e) {
                            // 如果不是有效的HTML，则作为文本显示
                            resultDisplay.textContent = data.result;
                        }

                        addLog('处理完成');
                    } else {
                        resultDisplay.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                        addLog(`处理失败: ${data.error}`, true);
                    }
                })
                .catch(error => {
                    resultDisplay.innerHTML = `<div class="alert alert-danger">请求出错</div>`;
                    addLog(`请求出错: ${error.message}`, true);
                });
        }

        // 添加日志
        function addLog(message, isError = false) {
            // 只在控制台输出日志，不再向页面添加
            console.log(`[${new Date().toLocaleTimeString()}] ${message}`);
        }

        // 页面加载完成
        window.addEventListener('load', function () {
            addLog('页面已加载，等待输入...');
        });
    </script>
</body>

</html>
